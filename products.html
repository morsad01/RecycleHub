<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Marketplace — ResellBD</title>
  <meta name="description" content="Explore verified pre-loved products on ResellBD. Filter by category, price, condition, and location in Bangladesh." />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Dynamic Global Header -->
  <div id="app-header"></div>

  <main class="container-custom py-8">
    <!-- Page Header & Search Bar -->
    <div style="display:flex;flex-direction:column;gap:1.5rem;margin-bottom:2rem;">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;">
        <div>
          <h1 style="font-size:1.875rem;font-weight:900;" data-i18n="nav.browse">Browse Marketplace</h1>
          <p style="font-size:0.875rem;color:var(--neutral-500);margin-top:0.25rem;">Search and discover verified pre-loved deals</p>
        </div>

        <div style="display:flex;align-items:center;gap:0.75rem;">
          <label style="font-size:0.8125rem;font-weight:600;color:var(--neutral-600);">Sort by:</label>
          <select id="sort-select" class="select-field" style="width:auto;padding:0.4rem 0.8rem;font-size:0.8125rem;">
            <option value="newest">Newest First</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
      </div>

      <!-- Search input -->
      <div style="position:relative;width:100%;">
        <input
          type="text"
          id="search-input"
          placeholder="Search by keywords, brand, model..."
          class="input-field"
          style="padding-left:2.75rem;border-radius:1rem;"
        />
        <svg style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--neutral-400);" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr;gap:2rem;" id="products-layout">
      <!-- Layout adjusts to 250px sidebar + grid on desktop -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2rem;">
        
        <!-- Filter Sidebar -->
        <div class="card" style="height:fit-content;padding:1.5rem;display:flex;flex-direction:column;gap:1.5rem;">
          <div>
            <h3 style="font-size:0.9375rem;font-weight:800;margin-bottom:0.75rem;">Categories</h3>
            <div id="filter-categories" style="display:flex;flex-direction:column;gap:0.5rem;font-size:0.8125rem;">
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
                <input type="radio" name="category" value="" checked /> All Categories
              </label>
              <!-- Filled dynamically by products.js -->
            </div>
          </div>

          <div>
            <h3 style="font-size:0.9375rem;font-weight:800;margin-bottom:0.75rem;">Condition</h3>
            <div style="display:flex;flex-direction:column;gap:0.5rem;font-size:0.8125rem;">
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;"><input type="checkbox" name="condition" value="new" /> Brand New</label>
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;"><input type="checkbox" name="condition" value="excellent" /> Excellent</label>
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;"><input type="checkbox" name="condition" value="good" /> Good</label>
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;"><input type="checkbox" name="condition" value="fair" /> Fair</label>
            </div>
          </div>

          <div>
            <h3 style="font-size:0.9375rem;font-weight:800;margin-bottom:0.75rem;">Max Price (৳)</h3>
            <input type="number" id="max-price-input" placeholder="e.g. 50000" class="input-field" style="padding:0.4rem 0.6rem;font-size:0.8125rem;" />
          </div>

          <button id="apply-filters-btn" class="btn btn-primary btn-sm" style="width:100%;">Apply Filters</button>
          <button id="clear-filters-btn" class="btn btn-ghost btn-sm" style="width:100%;">Reset Filters</button>
        </div>

        <!-- Products Grid Container -->
        <div style="grid-column: 1 / -1;display:flex;flex-direction:column;gap:1.5rem;" class="products-grid-column">
          <div id="products-count" style="font-size:0.875rem;color:var(--neutral-500);font-weight:600;">Loading listings...</div>
          
          <div id="marketplace-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem;">
            <!-- Rendered by products.js -->
            <div class="card" style="height:20rem;background:var(--neutral-100);" class="animate-pulse"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Dynamic Global Footer -->
  <div id="app-footer"></div>

  <!-- Page Logic -->
  <script type="module" src="/js/pages/products.js"></script>
</body>
</html>
