<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — ResellBD</title>
  <meta name="description" content="View verified pre-loved listing details, AI deal score, seller identity badges, and chat securely on ResellBD." />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Dynamic Global Header -->
  <div id="app-header"></div>

  <main class="container-custom py-8">
    <div id="product-loading" style="text-align:center;padding:4rem;">
      <div style="font-size:1.5rem;font-weight:700;color:var(--neutral-600);">Loading product details...</div>
    </div>

    <div id="product-container" style="display:none;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2.5rem;align-items:start;">
        
        <!-- Left: Image Gallery -->
        <div>
          <div class="card" style="padding:0.5rem;overflow:hidden;border-radius:1.5rem;background:#fff;margin-bottom:1rem;">
            <div style="aspect-ratio:4/3;background:var(--neutral-100);border-radius:1.25rem;overflow:hidden;position:relative;">
              <img id="main-product-img" src="" alt="" style="width:100%;height:100%;object-fit:cover;" />
              <div id="badges-overlay" style="position:absolute;top:1rem;left:1rem;display:flex;flex-direction:column;gap:0.5rem;"></div>
            </div>
          </div>
          <!-- Thumbnail list -->
          <div id="thumbnails-list" style="display:flex;gap:0.75rem;overflow-x:auto;padding-bottom:0.5rem;" class="scrollbar-hide"></div>
        </div>

        <!-- Right: Details & Purchase Card -->
        <div style="display:flex;flex-direction:column;gap:1.5rem;">
          
          <div>
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
              <span id="category-badge" class="badge badge-primary">Electronics</span>
              <span id="condition-badge" class="badge badge-accent">Excellent</span>
            </div>
            <h1 id="product-title" style="font-size:1.75rem;font-weight:900;line-height:1.2;color:var(--neutral-900);margin-bottom:0.75rem;"></h1>
            <div style="font-size:0.875rem;color:var(--neutral-500);display:flex;align-items:center;gap:1rem;">
              <span id="product-location">📍 Dhaka</span>
              <span id="product-views">👁️ 0 views</span>
            </div>
          </div>

          <!-- Price & Deal Score Banner -->
          <div class="card" style="background:linear-gradient(135deg,var(--primary-50),#ffffff);border:1.5px solid var(--primary-100);padding:1.25rem;">
            <div style="display:flex;align-items:baseline;justify-content:space-between;">
              <div>
                <span style="font-size:0.75rem;font-weight:700;color:var(--neutral-500);text-transform:uppercase;">Verified Asking Price</span>
                <div id="product-price" style="font-size:2rem;font-weight:900;color:var(--primary-700);font-family:var(--font-display);margin-top:0.25rem;"></div>
              </div>
              <div style="text-align:right;">
                <span class="badge badge-success" style="font-size:0.75rem;padding:0.35rem 0.75rem;">⚡ AI Deal Score: Fair Value</span>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
            <button id="add-to-cart-btn" class="btn btn-outline btn-lg" style="width:100%;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
              <span>Add to Cart</span>
            </button>
            <button id="buy-now-btn" class="btn btn-primary btn-lg" style="width:100%;">
              <span>⚡ Buy Now</span>
            </button>
          </div>

          <!-- Seller Identity Card -->
          <div class="card" style="padding:1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;">
            <div style="display:flex;align-items:center;gap:0.875rem;">
              <div id="seller-avatar" style="width:3rem;height:3rem;border-radius:9999px;background:var(--primary-100);color:var(--primary-800);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.125rem;"></div>
              <div>
                <div id="seller-name" style="font-weight:800;font-size:0.9375rem;color:var(--neutral-900);"></div>
                <div id="seller-badge-text" style="font-size:0.75rem;color:var(--success-600);font-weight:600;display:flex;align-items:center;gap:0.25rem;">
                  <span>🛡️ Government ID Verified Seller</span>
                </div>
              </div>
            </div>
            <button id="chat-seller-btn" class="btn btn-outline btn-sm">💬 Chat</button>
          </div>

          <!-- Description -->
          <div class="card" style="padding:1.5rem;">
            <h3 style="font-size:1rem;font-weight:800;margin-bottom:0.75rem;color:var(--neutral-900);" data-i18n="product.description">Description</h3>
            <div id="product-desc" style="font-size:0.875rem;color:var(--neutral-700);line-height:1.7;white-space:pre-line;"></div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- Dynamic Global Footer -->
  <div id="app-footer"></div>

  <!-- Page Logic -->
  <script type="module" src="/js/pages/product-detail.js"></script>
</body>
</html>
