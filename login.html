<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ResellBD</title>
  <meta name="description" content="Log in to your ResellBD account to manage your listings and purchases." />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Dynamic Global Header -->
  <div id="app-header"></div>

  <main class="container-custom py-12" style="max-width:28rem;">
    <div class="card" style="padding:2.5rem 2rem;">
      <div style="text-align:center;margin-bottom:2rem;">
        <h1 style="font-size:1.75rem;font-weight:900;" data-i18n="auth.loginTitle">Welcome Back</h1>
        <p style="font-size:0.875rem;color:var(--neutral-500);margin-top:0.25rem;" data-i18n="auth.loginSubtitle">Sign in to your ResellBD account</p>
      </div>

      <form id="login-form" style="display:flex;flex-direction:column;gap:1.25rem;">
        <div class="input-group">
          <label class="input-label" data-i18n="auth.email">Email Address</label>
          <input type="email" id="login-email" class="input-field" placeholder="yourname@gmail.com" required />
        </div>

        <div class="input-group">
          <label class="input-label" data-i18n="auth.password">Password</label>
          <input type="password" id="login-password" class="input-field" placeholder="••••••••" required />
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="margin-top:0.5rem;" data-i18n="auth.signIn">
          Sign In
        </button>

        <div style="text-align:center;font-size:0.875rem;color:var(--neutral-500);margin-top:1rem;">
          Don't have an account? <a href="/signup.html" style="color:var(--primary-600);font-weight:700;">Sign Up</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Dynamic Global Footer -->
  <div id="app-footer"></div>

  <!-- Page Logic -->
  <script type="module" src="/js/pages/auth-pages.js"></script>
</body>
</html>
