<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found — ResellBD</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="container-custom py-16 text-center" style="max-width:32rem;">
    <div style="font-size:4rem;font-weight:900;color:var(--primary-500);line-height:1;">404</div>
    <h1 style="font-size:1.5rem;font-weight:800;margin-top:0.75rem;margin-bottom:0.5rem;">Page Not Found</h1>
    <p style="font-size:0.875rem;color:var(--neutral-500);margin-bottom:1.5rem;">The page you are looking for might have been moved or deleted.</p>
    <a href="/index.html" class="btn btn-primary btn-lg">Back to Homepage</a>
  </main>
  <div id="app-footer"></div>
  <script type="module">
    import { auth } from './js/auth.js';
    import { UIEngine } from './js/ui.js';
    document.addEventListener('DOMContentLoaded', async () => {
      await auth.init();
      UIEngine.init();
    });
  </script>
</body>
</html>
