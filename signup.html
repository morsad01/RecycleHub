<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — ResellBD</title>
  <meta name="description" content="Create an account on ResellBD to buy and sell pre-loved goods." />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Dynamic Global Header -->
  <div id="app-header"></div>

  <main class="container-custom py-12" style="max-width:28rem;">
    <div class="card" style="padding:2.5rem 2rem;">
      <div style="text-align:center;margin-bottom:2rem;">
        <h1 style="font-size:1.75rem;font-weight:900;" data-i18n="auth.signupTitle">Create Account</h1>
        <p style="font-size:0.875rem;color:var(--neutral-500);margin-top:0.25rem;">Join Bangladesh's sustainable resale community</p>
      </div>

      <form id="signup-form" style="display:flex;flex-direction:column;gap:1.25rem;">
        <div class="input-group">
          <label class="input-label" data-i18n="auth.fullName">Full Name</label>
          <input type="text" id="signup-name" class="input-field" placeholder="Tanvir Ahmed" required />
        </div>

        <div class="input-group">
          <label class="input-label" data-i18n="auth.email">Email Address</label>
          <input type="email" id="signup-email" class="input-field" placeholder="tanvir@gmail.com" required />
        </div>

        <div class="input-group">
          <label class="input-label" data-i18n="auth.password">Password</label>
          <input type="password" id="signup-password" class="input-field" placeholder="Minimum 6 characters" minlength="6" required />
        </div>

        <button type="submit" id="signup-submit-btn" class="btn btn-primary btn-lg" style="margin-top:0.5rem;" data-i18n="auth.signUp">
          Create Free Account
        </button>

        <div style="text-align:center;font-size:0.875rem;color:var(--neutral-500);margin-top:1rem;">
          Already have an account? <a href="/login.html" style="color:var(--primary-600);font-weight:700;">Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Dynamic Global Footer -->
  <div id="app-footer"></div>

  <!-- Page Logic -->
  <script type="module" src="/js/pages/auth-pages.js"></script>
</body>
</html>
