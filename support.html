<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support & Help Center — ResellBD</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="container-custom py-12" style="max-width:38rem;">
    <div class="card" style="padding:2.5rem;">
      <h1 style="font-size:1.875rem;font-weight:900;margin-bottom:0.5rem;">Help & Support</h1>
      <p style="font-size:0.875rem;color:var(--neutral-500);margin-bottom:1.5rem;">Have questions or need assistance? Reach out to our team.</p>

      <form id="support-form" style="display:flex;flex-direction:column;gap:1.25rem;">
        <div class="input-group">
          <label class="input-label">Your Email</label>
          <input type="email" class="input-field" placeholder="yourname@gmail.com" required />
        </div>
        <div class="input-group">
          <label class="input-label">Subject</label>
          <input type="text" class="input-field" placeholder="Question regarding listing or verification" required />
        </div>
        <div class="input-group">
          <label class="input-label">Message Details</label>
          <textarea class="textarea-field" rows="4" placeholder="How can we help?" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Submit Support Ticket</button>
      </form>
    </div>
  </main>
  <div id="app-footer"></div>
  <script type="module">
    import { auth } from './js/auth.js';
    import { UIEngine } from './js/ui.js';
    import { toast } from './js/toast.js';
    document.addEventListener('DOMContentLoaded', async () => {
      await auth.init();
      UIEngine.init();
      document.getElementById('support-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        toast.success('Your message has been sent to our support team!');
        e.target.reset();
      });
    });
  </script>
</body>
</html>
