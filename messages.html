<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — ResellBD</title>
  <meta name="description" content="Secure in-app messaging and safe meetup proposals on ResellBD." />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Dynamic Global Header -->
  <div id="app-header"></div>

  <main class="container-custom py-8" style="max-width:56rem;">
    <h1 style="font-size:1.875rem;font-weight:900;margin-bottom:1.5rem;" data-i18n="nav.messages">Messages</h1>

    <div class="card" style="height:32rem;padding:0;display:grid;grid-template-columns:18rem 1fr;overflow:hidden;" id="chat-layout">
      
      <!-- Conversations List -->
      <div style="border-right:1px solid var(--neutral-200);background:var(--neutral-50);display:flex;flex-direction:column;">
        <div style="padding:1rem;border-bottom:1px solid var(--neutral-200);font-weight:800;font-size:0.9375rem;">
          Conversations
        </div>
        <div id="conv-list" style="flex:1;overflow-y:auto;padding:0.5rem;display:flex;flex-direction:column;gap:0.25rem;">
          <div style="text-align:center;color:var(--neutral-400);font-size:0.8125rem;padding:2rem;">No active chats</div>
        </div>
      </div>

      <!-- Chat Thread Area -->
      <div style="display:flex;flex-direction:column;background:#fff;">
        <!-- Thread Header -->
        <div style="padding:0.875rem 1.25rem;border-bottom:1px solid var(--neutral-100);display:flex;align-items:center;justify-content:space-between;">
          <div style="font-weight:800;font-size:0.9375rem;" id="chat-peer-name">Direct Chat</div>
          <span class="badge badge-success">🛡️ Safe Meetup Protected</span>
        </div>

        <!-- Messages Thread -->
        <div id="chat-thread" style="flex:1;padding:1rem;overflow-y:auto;display:flex;flex-direction:column;gap:0.75rem;background:var(--neutral-50);font-size:0.875rem;">
          <div style="text-align:center;color:var(--neutral-400);font-size:0.8125rem;margin:auto;">Select or start a conversation with a seller from a product page.</div>
        </div>

        <!-- Chat Input Form -->
        <form id="send-msg-form" style="padding:0.875rem;border-top:1px solid var(--neutral-100);display:flex;gap:0.5rem;background:#fff;">
          <input type="text" id="chat-msg-input" placeholder="Type a message..." class="input-field" style="border-radius:9999px;" />
          <button type="submit" class="btn btn-primary btn-sm" style="border-radius:9999px;padding:0.5rem 1.25rem;">Send</button>
        </form>
      </div>

    </div>
  </main>

  <!-- Dynamic Global Footer -->
  <div id="app-footer"></div>

  <!-- Page Logic -->
  <script type="module" src="/js/pages/messages.js"></script>
</body>
</html>
