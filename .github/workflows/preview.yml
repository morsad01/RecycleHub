name: Preview Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check & Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build Preview
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      # Example Vercel Preview Deployment
      # - name: Deploy to Vercel Preview
      #   run: npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
